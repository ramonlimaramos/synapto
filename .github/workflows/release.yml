name: release

# Publishes whatever version `main` already declares.
#
# The workflow deliberately does not bump anything. A version is a reviewed
# decision: it lands through a pull request together with the CHANGELOG entry
# and the regenerated uv.lock, and this workflow only ships what that PR
# agreed on. That separation is what gives the version-consistency assert
# below any meaning — a job that writes the version and then checks the
# version it just wrote verifies nothing.
#
# The v0.5 maintenance line hardened this pipeline into four jobs so that
# building never holds the permissions that mutate the outside world. That
# split is kept; only the hard-pinned ref and version constant are gone.

on:
  workflow_dispatch:

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.assert.outputs.version }}
    steps:
      - name: check admin permission
        uses: actions-cool/check-user-permission@v2
        id: check
        with:
          require: admin
          username: ${{ github.triggering_actor }}

      - name: abort if not admin
        if: steps.check.outputs.require-result != 'true'
        run: |
          echo "error: only repo admins can create releases"
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The gate parses TOML with the standard library, so it needs 3.11+. The
      # runner image's system interpreter is not a contract — pinning one here
      # keeps a future ubuntu-latest rotation from turning the release path red
      # for a reason unrelated to the release. No project dependency is
      # installed: this job must stay able to fail in seconds.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Everything knowable before a build happens here, so a drifted version or
      # a colliding tag costs a few seconds instead of a published artifact that
      # cannot be withdrawn. The logic lives in a script rather than in this
      # file so that its failure paths are covered by the test suite.
      - name: assert release contract
        id: assert
        run: python3 scripts/assert_release_contract.py

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: set up python
        run: uv python install 3.13

      - name: install build tools
        run: uv sync --extra dev --python 3.13

      - name: build package
        run: uv run python -m build

      # The gate the v0.5.1 line added: every artifact from 0.1.0 to 0.5.0
      # shipped without migrations and would have failed here. Both
      # distributions are checked, because the sdist is publishable too.
      - name: verify packaged migrations
        run: uv run python scripts/verify_wheel.py dist/*.whl dist/*.tar.gz

      - name: upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Tagging comes before publishing on purpose. A PyPI upload is immutable, so
  # discovering a tag collision afterwards would leave a published artifact with
  # no matching source tag and no way to undo it. Git, by contrast, is
  # recoverable — so the mutation that can be fixed happens first.
  tag:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # First external mutation, so it sits behind the protected release gate.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Idempotent on retry: an existing tag is fine only if it already points
      # at this exact commit. Anything else means the tag names different code.
      - name: create tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing=$(git rev-list -n1 "${tag}")
            if [ "${existing}" != "${GITHUB_SHA}" ]; then
              echo "error: ${tag} already points at ${existing}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "${tag} already points at this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${tag}"
            git push origin "${tag}"
          fi

  publish:
    needs: [prepare, build, tag]
    runs-on: ubuntu-latest
    # Trusted Publishing resolves its identity through this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # No skip-existing: a re-run must fail loudly rather than paper over a
      # partial publication, so recovery stays deterministic.
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Last and separately retryable: if this fails, re-running it does not
      # republish to PyPI.
      - name: create github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "v${{ needs.prepare.outputs.version }}"
          files: dist/*
          body: |
            ## what's changed

            see [CHANGELOG.md](https://github.com/ramonlimaramos/synapto/blob/v${{ needs.prepare.outputs.version }}/CHANGELOG.md) for details.

            ### install / upgrade

            ```bash
            pip install synapto==${{ needs.prepare.outputs.version }}
            ```

            or with auto-updates (recommended):
            ```json
            { "command": "uvx", "args": ["--refresh", "synapto", "serve"] }
            ```
